<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>SentinelDNS — Login</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(420px, 100%);
        }

        .login-form {
            display: grid;
            gap: 16px;
        }

        .login-form label {
            display: grid;
            gap: 6px;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
        }

        .login-error {
            display: none;
        }

        .login-error.visible {
            display: block;
        }

        .login-button {
            width: 100%;
        }
    </style>
</head>

<body>

<main class="login-page">

    <section
        class="login-card"
        aria-labelledby="login-title"
    >

        <header>
            <h1 id="login-title">
                SentinelDNS
            </h1>

            <p>
                DNS management dashboard
            </p>
        </header>

        <form
            id="login-form"
            class="login-form"
            method="post"
            novalidate
        >

            <label for="username">
                Username

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    required
                    maxlength="128"
                >
            </label>

            <label for="password">
                Password

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    maxlength="256"
                >
            </label>

            <p
                id="login-error"
                class="login-error"
                role="alert"
                aria-live="polite"
            ></p>

            <button
                id="login-button"
                class="login-button"
                type="submit"
            >
                Sign in
            </button>

        </form>

    </section>

</main>

<script src="/static/js/login.js" defer></script>

</body>
</html>
