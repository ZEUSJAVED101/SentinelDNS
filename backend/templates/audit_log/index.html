{% extends "base.html" %}

{% block page_title %}Audit Log{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', path='css/audit-log.css') }}">
<section class="audit-page" aria-labelledby="audit-title">
    <div class="audit-header">
        <div>
            <h1 id="audit-title">Audit Log</h1>
            <p>Administrative and security events recorded by SentinelDNS.</p>
        </div>
        <button type="button" class="audit-refresh" id="auditRefresh">Refresh</button>
    </div>

    <div class="audit-status" id="auditStatus" role="status" aria-live="polite">
        Loading audit events...
    </div>

    <div class="audit-table-wrap">
        <table class="audit-table">
            <thead>
                <tr>
                    <th scope="col">Time</th>
                    <th scope="col">Administrator</th>
                    <th scope="col">Action</th>
                    <th scope="col">Result</th>
                    <th scope="col">Resource</th>
                    <th scope="col">Details</th>
                </tr>
            </thead>
            <tbody id="auditTableBody"></tbody>
        </table>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/audit-log.js') }}" defer></script>
{% endblock %}
